baseURL = 'https://jhawk-cis.netlify.app/'
locale = 'en-us'
title = 'JHawk - CIS'
theme = 'beautifulhugo'

# hugo.toml

[pagination]
  pagerSize = 5

[Services]
  [Services.googleAnalytics]
    # id = "GTM-NNSFS9SD"

[Params]
  subtitle = "Keeping Our Promise To America's Veterans"
  mainSections = ["post","posts"]
  logo = "/img/dav-seal.png"
  favicon = "/img/dav-seal.png"
  dateFormat = ":date_long"
  commit = false
  rss = false
  toc = false
  readingTime = false
  wordCount = false
  colorScheme = "light"
  socialShare = false
  showRelatedPosts = false
  hideAuthor = true
  disableFigureOverride = true
  headerImgStyle = "narrow"
  delayDisqus = true
  custom_css = "css/dav-custom.css"

[markup.goldmark.renderer] 
    unsafe = true

[[Params.bigimg]]
  src = "/img/dav84-banner-00.png"
  desc = ""
  position = "left bottom"
[[Params.bigimg]]
  src = "/img/dav84-banner-00.png"
  desc = ""
  position = "right bottom"
[[Params.bigimg]]
  src = "/img/dav84-banner-00.png"
  desc = ""
  position = "left top"
[[Params.bigimg]]
  src = "/img/dav84-banner-00.png"
  desc = ""
  position = "right top"

[Params.author]
  email = "contact@dav84.us"
  facebook = "DAV84IL"
  instagram = "DAV84IL"


[[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

[[menu.main]]
