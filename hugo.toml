    weight = 4

[[menu.main]]
    name = "Store"
    url = "/store"
    weight = 5

[[menu.main]]
    name = "COD-CIS Info"
    url = "page/cod/"
    weight = 6

[[menu.main]]
    name = "TCD-CIS Info"
    url = "page/tcd/"
    weight = 7
